server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    # ====================================================
    # SECURITY HEADERS
    # ====================================================
    add_header X-Frame-Options "SAMEORIGIN"                           always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-XSS-Protection "1; mode=block"                       always;
    add_header Referrer-Policy "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Sembunyikan versi Nginx dari response header
    server_tokens off;

    index index.php index.html;
    charset utf-8;

    # ====================================================
    # GZIP COMPRESSION
    # Mengurangi ukuran response secara signifikan (HTML, CSS, JS)
    # ====================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ====================================================
    # LOG
    # PERBAIKAN: Gunakan 'warn' bukan 'debug' di production.
    # Level debug menghasilkan log sangat besar dan verbose.
    # ====================================================
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ====================================================
    # ROUTING UTAMA — Laravel Frontend Controller
    # ====================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    # ====================================================
    # CACHING STATIC ASSETS
    # Vite menghasilkan filename dengan content hash (e.g. app.abc123.js),
    # sehingga aman menggunakan cache jangka panjang (immutable).
    # ====================================================
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ====================================================
    # PHP-FPM — Proxy ke container web_app
    # ====================================================
    location ~ \.php$ {
        fastcgi_pass web_app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Buffer settings untuk performa
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        # Timeout settings
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # ====================================================
    # KEAMANAN: Blokir akses ke file/folder tersembunyi
    # Kecuali .well-known (digunakan untuk SSL cert renewal)
    # ====================================================
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}